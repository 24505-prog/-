<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 스마트 전신 코디룸 (GitHub-GAS 연동)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="p-6 bg-slate-100">
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h1 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> AI 스마트 전신 코디룸</h1>
                <div class="mt-3 p-3 bg-slate-50 rounded-xl text-xs font-medium text-slate-600">
                    <span><i class="fa-solid fa-user"></i> qotmdals1234 님의 옷장 리스트</span>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-3">
                <h3 class="text-sm font-bold text-emerald-600">+ 내 옷장에 새 옷 추가하기</h3>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <select id="mainCategory" class="p-2 border rounded-lg bg-white"><option>상의</option><option>하의</option><option>아우터</option><option>신발</option></select>
                    <select id="subCategory" class="p-2 border rounded-lg bg-white"><option>반팔 티셔츠</option><option>셔츠</option><option>청바지</option></select>
                    <select id="color" class="p-2 border rounded-lg bg-white"><option>화이트</option><option>블랙</option><option>네이비</option></select>
                </div>
                <input type="text" id="clothName" placeholder="옷 이름" class="w-full p-2 text-xs border rounded-lg">
                <button onclick="addCloth()" class="w-full bg-slate-800 text-white text-xs font-bold p-2.5 rounded-lg">내 옷장에 저장</button>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h3 class="text-sm font-bold text-indigo-600 mb-3">코디에 조합할 옷 선택하기</h3>
                <div id="closet-list" class="space-y-2 text-xs text-slate-400"></div>
            </div>
        </div>
        <div class="space-y-4">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                <h3 class="text-sm font-bold">전신 코디 매칭 리스트</h3>
                <div id="selected-list" class="border rounded-xl p-3 min-h-[80px] text-xs text-slate-400">선택된 옷이 없습니다.</div>
                <textarea id="question" rows="2" placeholder="상황 입력" class="w-full p-2 text-xs rounded-lg border"></textarea>
                <button onclick="getAIAdvice()" class="w-full bg-indigo-600 text-white font-bold p-2.5 rounded-lg text-xs">코디 진단받기</button>
                <div id="ai-box" class="hidden p-3 bg-indigo-50 rounded-xl border text-xs space-y-2">
                    <p id="ai-text" class="text-slate-700 leading-relaxed"></p>
                    <button onclick="speak()" class="w-full bg-amber-500 text-white p-2 rounded-lg font-bold">📢 피드백 음성 듣기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // 파이어베이스 리얼타임 데이터베이스 설정
        const firebaseConfig = { databaseURL: "https://my-closet-4a027-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userId = "qotmdals1234"; 

        // 승민님이 주신 구글 웹 앱 URL 주소 연동 완료!
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwskKdflzq3DctssiwIUXgn0T9YFUuKQdsvvKLk80SDi-2jmMsFW6A6Jwsh_84ZuSA3/exec";

        function addCloth() {
            const main = document.getElementById("mainCategory").value;
            const sub = document.getElementById("subCategory").value;
            const col = document.getElementById("color").value;
            const name = document.getElementById("clothName").value || sub;
            db.ref('items/' + userId).push({ main: main, sub: sub, color: col, name: name }, function(err) {
                if(!err) { alert("의류가 옷장에 등록되었습니다!"); document.getElementById("clothName").value = ""; }
            });
        }

        db.ref('items/' + userId).on('value', function(snapshot) {
            const listDiv = document.getElementById("closet-list"); listDiv.innerHTML = "";
            const data = snapshot.val();
            if(!data) { listDiv.innerText = "옷장이 비어있습니다."; return; }
            Object.keys(data).forEach(key => {
                const item = data[key];
                listDiv.innerHTML += `
                    <div class="flex items-center gap-2 p-2 bg-slate-50 rounded border text-left">
                        <input type="checkbox" name="cloth" value="${item.main} ${item.color} ${item.name}" onchange="updateSelected()">
                        <span>[${item.main}] ${item.color} ${item.name}</span>
                    </div>`;
            });
        });

        function updateSelected() {
            const box = document.getElementById("selected-list"); box.innerHTML = "";
            const checked = document.querySelectorAll('input[name="cloth"]:checked');
            if(checked.length === 0) { box.innerText = "선택된 옷이 없습니다."; return; }
            checked.forEach(c => { box.innerHTML += `<div class="p-1 bg-indigo-50 rounded border mb-1">${c.value}</div>`; });
        }

        let lastAIResult = "";
        async function getAIAdvice() {
            const checked = document.querySelectorAll('input[name="cloth"]:checked');
            const q = document.getElementById("question").value;
            if(checked.length === 0 || !q) return alert("옷과 상황을 지정해 주세요.");
            let selectedClothes = []; checked.forEach(c => selectedClothes.push(c.value));

            // 깃허브에서 구글 앱스 스크립트로 AI 연동 신호 전송
            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "askAI", clothDetails: selectedClothes.join(", "), userQuestion: q })
            });
            const data = await response.json();
            lastAIResult = data.result;
            document.getElementById("ai-text").innerText = lastAIResult;
            document.getElementById("ai-box").classList.remove("hidden");
        }

        async function speak() {
            // 깃허브에서 구글 앱스 스크립트로 음성(TTS) 연동 신호 전송
            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "generateTTS", text: lastAIResult })
            });
            const data = await response.json();
            const audio = new Audio("data:audio/mp3;base64," + data.result);
            audio.play();
        }
    </script>
</body>
</html>
