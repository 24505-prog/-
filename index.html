<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM AI CODI ROOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-gradient-to-r from-slate-900 to-indigo-950 rounded-2xl p-6 border border-slate-800 shadow-xl">
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-3">
                    <i class="fa-solid fa-gem text-indigo-400 animate-pulse"></i> LUXURY AI CODI ROOM
                </h1>
                <div class="mt-3 flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/60 pt-3">
                    <span><i class="fa-solid fa-circle-user text-indigo-400 mr-1"></i> qotmdals1234 MASTER CLOSET</span>
                    <span class="bg-indigo-500/10 text-indigo-400 px-2.5 py-0.5 rounded-full border border-indigo-500/20">Active</span>
                </div>
            </div>
            
            <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl p-6 border border-slate-800 shadow-lg space-y-4">
                <h3 class="text-sm font-bold text-indigo-400 tracking-wider uppercase flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> 피스 추가하기
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400 font-medium">카테고리</label>
                        <select id="mainCategory" onchange="updateSubCategories()" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-medium focus:outline-none focus:border-indigo-500 transition-all">
                            <option value="상의">👕 상의</option>
                            <option value="하의">👖 하의</option>
                            <option value="아우터">🧥 아우터</option>
                            <option value="신발">👟 신발</option>
                            <option value="모자">🧢 모자</option>
                            <option value="시계">⌚ 시계</option>
                            <option value="가방">💼 가방</option>
                            <option value="액세서리">🕶️ 액세서리</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400 font-medium">세부 종류</label>
                        <select id="subCategory" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-medium focus:outline-none focus:border-indigo-500 transition-all"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400 font-medium">컬러 매칭</label>
                        <select id="color" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-medium focus:outline-none focus:border-indigo-500 transition-all">
                            <option>블랙</option><option>화이트</option><option>네이비</option><option>그레이</option>
                            <option>차콜</option><option>베이지</option><option>아이보리</option><option>카키</option>
                            <option>브라운</option><option>버건디</option><option>올리브</option><option>데님</option>
                            <option>실버</option><option>골드</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="addClothAndSelect()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-bold p-3.5 rounded-xl hover:from-indigo-500 hover:to-purple-500 shadow-lg shadow-indigo-950/50 transition-all transform active:scale-[0.99] mt-2">
                    드레스룸 스토리지에 저장
                </button>
            </div>
        </div>

        <div class="space-y-6">
            <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl p-6 border border-slate-800 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="text-sm font-bold text-white tracking-wide">현재 빌드업된 코디 조합</h3>
                    <button onclick="clearSelected()" class="text-[10px] text-rose-400 border border-rose-900/50 px-2 py-1 rounded-lg bg-rose-950/30 hover:bg-rose-950/60 transition-all">전체 비우기</button>
                </div>
                
                <div id="selected-list" class="border border-slate-800/80 rounded-xl p-3 min-h-[140px] text-xs text-slate-500 space-y-2 bg-slate-950/40 max-h-[220px] overflow-y-auto">
                    선택된 조각이 없습니다. 왼쪽에서 아이템을 추가해 컴포즈해 보세요.
                </div>
                
                <div class="space-y-1.5 pt-2">
                    <label class="block text-xs font-semibold text-slate-300">오늘의 연출 상황 / 목적 (TPO)</label>
                    <textarea id="question" rows="2" placeholder="예: 한남동 갤러리 데이트, 시크하고 댄디하게" class="w-full p-3 text-xs rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none transition-all"></textarea>
                </div>
                
                <button onclick="getAIAdvice()" class="w-full bg-slate-100 text-slate-950 font-bold p-3 rounded-xl text-xs hover:bg-white transition-all transform active:scale-[0.99] shadow-md shadow-black/40">
                    스타일리스트 인공지능 진단받기
                </button>
                
                <div id="ai-box" class="hidden p-4 bg-gradient-to-b from-indigo-950/40 to-slate-900 rounded-xl border border-indigo-900/50 text-xs space-y-3">
                    <div class="flex items-center gap-1.5 text-indigo-400 font-bold border-b border-indigo-900/30 pb-2">
                        <i class="fa-solid fa-comment-dots"></i> STYLIST REPORT
                    </div>
                    <p id="ai-text" class="text-slate-200 leading-relaxed font-light"></p>
                    <button onclick="speak()" class="w-full bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 p-2.5 rounded-lg font-medium border border-indigo-500/30 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-volume-high text-xs"></i> 런웨이 보이스 피드백 듣기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://my-closet-4a027-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userId = "qotmdals1234"; 

        // 🔗 76번째 줄: 발급받으신 앱스크립트 신규 웹앱 주소로 채워주세요!
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyGZCMGLwjOVet1xq3MWw-0zjrkeLPKKc3k0IiGdySogvzBqkN6Xp7MgIEYtRmcWEg/exec";

        // 👑 승민님 맞춤 대폭 확장형 하이엔드 라인업 카테고리 데이터
        const categories = {
            "상의": ["반팔 티셔츠", "긴팔 티셔츠", "셔츠", "맨투맨", "후드티", "니트", "카라티", "나일론 풀오버"],
            "하의": ["청바지", "슬랙스", "트레이닝 팬츠", "조거팬츠", "반바지", "와이드팬츠", "카고팬츠"],
            "아우터": ["후드집업", "가디건", "블레이저(자켓)", "데님자켓", "레더자켓", "바람막이", "롱코트", "숏패딩"],
            "신발": ["스니커즈", "캔버스화", "더비슈즈", "로퍼", "첼시부츠", "워커", "샌들"],
            "모자": ["볼캡", "버킷햇", "비니", "캠프캡", "페도라"],
            "시계": ["메탈 오토매틱 워치", "가죽 드레스 워치", "스포츠 디지털 워치", "스마트 워치"],
            "가방": ["백팩", "토트백", "크로스백", "메신저백", "클러치백"],
            "액세서리": ["선글라스", "실버 목걸이", "체인 팔찌", "미니멀 반지", "안경"]
        };

        function updateSubCategories() {
            const mainVal = document.getElementById("mainCategory").value;
            const subSelect = document.getElementById("subCategory");
            subSelect.innerHTML = "";
            categories[mainVal].forEach(function(item) {
                const option = document.createElement("option");
                option.value = item;
                option.textContent = item;
                subSelect.appendChild(option);
            });
        }

        window.onload = function() {
            updateSubCategories();
        };

        let selectedClothes = [];

        function addClothAndSelect() {
            const main = document.getElementById("mainCategory").value;
            const sub = document.getElementById("subCategory").value;
            const col = document.getElementById("color").value;
            const fullClothText = `[${main}] ${col} ${sub}`;

            // 파이어베이스 카테고리 분산 저장 프로세스 (깔끔 트리 구조 구현 완료)
            db.ref('items/' + userId + '/' + main).push({ sub: sub, color: col, name: sub });
            selectedClothes.push(fullClothText);
            updateSelectedUI();
        }

        function updateSelectedUI() {
            const box = document.getElementById("selected-list");
            if (selectedClothes.length === 0) {
                box.className = "border border-slate-800/80 rounded-xl p-3 min-h-[140px] text-xs text-slate-500 space-y-2 bg-slate-950/40";
                box.innerText = "선택된 조각이 없습니다. 왼쪽에서 아이템을 추가해 컴포즈해 보세요.";
                return;
            }
            box.className = "border border-slate-800 rounded-xl p-3 min-h-[140px] text-xs text-slate-200 space-y-1.5 bg-slate-950/80 max-h-[220px] overflow-y-auto";
            box.innerHTML = "";
            selectedClothes.forEach((item, index) => {
                box.innerHTML += `
                    <div class="flex justify-between items-center p-2 bg-slate-900 border border-slate-800 rounded-lg shadow-sm">
                        <span class="font-medium text-[11px] text-slate-300"><i class="fa-solid fa-check text-[9px] text-indigo-400 mr-1.5"></i>${item}</span>
                        <button onclick="removeSelected(${index})" class="text-slate-500 hover:text-rose-400 transition-all px-1">✕</button>
                    </div>`;
            });
        }

        window.removeSelected = function(index) {
            selectedClothes.splice(index, 1);
            updateSelectedUI();
        };

        window.clearSelected = function() {
            selectedClothes = [];
            updateSelectedUI();
        };

        let lastAIResult = "";
        
        async function getAIAdvice() {
            const q = document.getElementById("question").value.trim();
            if(selectedClothes.length === 0 || !q) {
                alert("아이템을 스토리지에 저장하고 연출할 상황(TPO)을 기입해 주십시오.");
                return;
            }

            document.getElementById("ai-text").innerText = "클로드 에이전트 스타일리스트가 의상 매칭 스코어를 분석하고 있습니다...";
            document.getElementById("ai-box").classList.remove("hidden");

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "askAI", clothDetails: selectedClothes.join(", "), userQuestion: q })
                });
                
                const data = await response.json();
                
                if (data && data.result) {
                    lastAIResult = data.result;
                    document.getElementById("ai-text").innerText = lastAIResult;
                } else {
                    document.getElementById("ai-text").innerText = "구글 서버 내에서 응답 객체를 수신하는 데 지연이 발생했습니다.";
                }
            } catch(err) {
                console.error(err);
                document.getElementById("ai-text").innerText = "통신 연결망 인터페이스 에러. 앱스크립트 속성 키 혹은 웹앱 배포 옵션(새 버전 적용) 상태를 최종 진단하십시오.";
            }
        }

        async function speak() {
            if(!lastAIResult) return;
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "generateTTS", text: lastAIResult })
                });
                const data = await response.json();
                if(data && data.result) {
                    const audio = new Audio("data:audio/mp3;base64," + data.result);
                    audio.play();
                }
            } catch(e) {
                alert("음성 합성 엔진 라이브러리 가동 실패.");
            }
        }
    </script>
</body>
</html>
