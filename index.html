<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 스마트 전신 코디룸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="p-6 bg-slate-100">
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h1 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> AI 스마트 전신 코디룸</h1>
                <div class="mt-3 p-3 bg-slate-50 rounded-xl text-xs font-medium text-slate-600">
                    <span><i class="fa-solid fa-user"></i> qotmdals1234 님의 옷장 시스템</span>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-3">
                <h3 class="text-sm font-bold text-emerald-600">+ 코디할 옷 선택하기</h3>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <select id="mainCategory" class="p-2 border rounded-lg bg-white"><option>상의</option><option>하의</option><option>아우터</option><option>신발</option></select>
                    <select id="subCategory" class="p-2 border rounded-lg bg-white"><option>반팔 티셔츠</option><option>셔츠</option><option>청바지</option><option>슬랙스</option></select>
                    <select id="color" class="p-2 border rounded-lg bg-white"><option>화이트</option><option>블랙</option><option>네이비</option><option>그레이</option></select>
                </div>
                <button onclick="addClothAndSelect()" class="w-full bg-indigo-600 text-white text-xs font-bold p-3 rounded-lg hover:bg-indigo-700 shadow-sm">
                    내 옷장에 저장
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-800">전신 코디 매칭 리스트</h3>
                    <button onclick="clearSelected()" class="text-[10px] text-red-500 border border-red-200 px-1.5 py-0.5 rounded bg-red-50">전체 비우기</button>
                </div>
                <div id="selected-list" class="border rounded-xl p-3 min-h-[120px] text-xs text-slate-400 space-y-1 bg-slate-50/50">
                    선택된 옷이 없습니다. 왼쪽에서 옷을 저장해 주세요!
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">오늘 입고 갈 상황이나 목적</label>
                    <textarea id="question" rows="2" placeholder="예: 대학교 꾸안꾸 데이트룩" class="w-full p-2 text-xs rounded-lg border"></textarea>
                </div>
                <button onclick="getAIAdvice()" class="w-full bg-slate-800 text-white font-bold p-2.5 rounded-lg text-xs hover:bg-slate-900">
                    코디 진단받기
                </button>
                
                <div id="ai-box" class="hidden p-3 bg-indigo-50 rounded-xl border text-xs space-y-2">
                    <p id="ai-text" class="text-slate-700 leading-relaxed"></p>
                    <button onclick="speak()" class="w-full bg-amber-500 text-white p-2 rounded-lg font-bold">📢 피드백 음성 듣기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://my-closet-4a027-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userId = "qotmdals1234"; 

        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwskKdflzq3DctssiwIUXgn0T9YFUuKQdsvvKLk80SDi-2jmMsFW6A6Jwsh_84ZuSA3/exec";

        let selectedClothes = [];

        function addClothAndSelect() {
            const main = document.getElementById("mainCategory").value;
            const sub = document.getElementById("subCategory").value;
            const col = document.getElementById("color").value;
            
            const fullClothText = `[${main}] ${col} ${sub}`;

            // 파이어베이스 데이터베이스 저장
            db.ref('items/' + userId).push({ main: main, sub: sub, color: col, name: sub }, function(err) {
                if(!err) { 
                    alert("의류가 옷장에 등록되었으며 코디 리스트에 즉시 반영되었습니다!"); 
                }
            });

            // 오른쪽 매칭 리스트에 즉시 추가
            selectedClothes.push(fullClothText);
            updateSelectedUI();
        }

        function updateSelectedUI() {
            const box = document.getElementById("selected-list");
            if (selectedClothes.length === 0) {
                box.className = "border rounded-xl p-3 min-h-[120px] text-xs text-slate-400 space-y-1 bg-slate-50/50";
                box.innerText = "선택된 옷이 없습니다. 왼쪽에서 옷을 저장해 주세요!";
                return;
            }
            
            box.className = "border rounded-xl p-3 min-h-[120px] text-xs text-slate-700 space-y-1 bg-white";
            box.innerHTML = "";
            selectedClothes.forEach((item, index) => {
                box.innerHTML += `
                    <div class="flex justify-between items-center p-1.5 bg-indigo-50/60 border border-indigo-100 rounded">
                        <span>${item}</span>
                        <button onclick="removeSelected(${index})" class="text-slate-400 hover:text-red-500 text-[10px]">❌</button>
                    </div>`;
            });
        }

        window.removeSelected = function(index) {
            selectedClothes.splice(index, 1);
            updateSelectedUI();
        };

        window.clearSelected = function() {
            selectedClothes = [];
            updateSelectedUI();
        };

        let lastAIResult = "";
        async function getAIAdvice() {
            const q = document.getElementById("question").value;
            if(selectedClothes.length === 0 || !q) return alert("코디할 옷을 저장하고 상황을 입력해 주세요.");

            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "askAI", clothDetails: selectedClothes.join(", "), userQuestion: q })
            });
            const data = await response.json();
            lastAIResult = data.result;
            document.getElementById("ai-text").innerText = lastAIResult;
            document.getElementById("ai-box").classList.remove("hidden");
        }

        async function speak() {
            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "generateTTS", text: lastAIResult })
            });
            const data = await response.json();
            const audio = new Audio("data:audio/mp3;base64," + data.result);
            audio.play();
        }
    </script>
</body>
</html>
